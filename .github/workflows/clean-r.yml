name: Clean Linux R 4.6.0 deployment
on:
  push:
    branches: [main, demo]
    paths: ['app.R', 'R/**', 'tests/**', '.github/workflows/clean-r.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Install application and test dependencies
        shell: Rscript {0}
        run: |
          stopifnot(as.character(getRversion()) == "4.6.0")
          options(repos=c(CRAN="https://packagemanager.posit.co/cran/__linux__/jammy/latest"))
          install.packages(c("shiny","ggplot2","ggrepel","svglite","colourpicker",
            "rhandsontable","readxl","jsonlite","drc","multcomp","patchwork",
            "rsconnect","writexl","shinytest2","cpp11","progress","RcppEigen","RcppArmadillo"),
            Ncpus=2)
      - name: Synthetic regression and Shiny tests
        run: |
          Rscript tests/unit.R
          Rscript tests/smoke.R
          Rscript tests/mtt-editorial.R
      - name: Chromium first-load and figure export tests
        run: Rscript tests/startup-browser.R
      - name: Regenerate manifest in installed environment
        shell: Rscript {0}
        run: |
          options(repos=c(CRAN="https://packagemanager.posit.co/cran/__linux__/jammy/latest"))
          files <- c("app.R","R/analysis.R","R/mtt_visualization_v4_LDJ_Prism.R","R/mtt_shiny.R")
          rsconnect::writeManifest(appDir=".",appFiles=files)
          m <- jsonlite::read_json("manifest.json")
          stopifnot(m$platform=="4.6.0",
            setequal(names(m$files),files))
          bad <- vapply(m$packages,function(p) identical(p$Source,"any"),logical(1))
          stopifnot(!any(bad))
          writeLines(capture.output(sessionInfo()),"R-session.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: ldj-prism-r460-verified
          path: |
            app.R
            R/analysis.R
            R/mtt_visualization_v4_LDJ_Prism.R
            R/mtt_shiny.R
            manifest.json
            R-session.txt
            test-artifacts/
      - name: Commit verified dependency manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "build: regenerate verified manifest with R 4.6.0"
          git push origin "HEAD:$GITHUB_REF_NAME"

