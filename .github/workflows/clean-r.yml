name: Clean Linux R 4.6.0 deployment
on:
  push:
    branches: [demo, 'fix/clean-r-manifest-inventory', 'fix/module-navigation-manual-data', 'fix/posit-module-runtime-qa', 'fix/mtt-empty-control-map', 'feature/mtt-anova-dunnett-editorial', 'feature/ldj-prism-editorial-integration', 'feature/ldj-prism-usability-axis-layout']
    paths: ['manifest.json', 'app.R', 'R/**', 'tests/**', '.github/workflows/clean-r.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/demo' || github.ref == 'refs/heads/fix/clean-r-manifest-inventory' || github.ref == 'refs/heads/fix/module-navigation-manual-data' || github.ref == 'refs/heads/fix/posit-module-runtime-qa' || github.ref == 'refs/heads/fix/mtt-empty-control-map' || github.ref == 'refs/heads/feature/mtt-anova-dunnett-editorial' || github.ref == 'refs/heads/feature/ldj-prism-editorial-integration' || github.ref == 'refs/heads/feature/ldj-prism-usability-axis-layout'
    runs-on: ubuntu-22.04
    env:
      RENV_CONFIG_CACHE_ENABLED: 'FALSE'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Restore and verify the committed manifest
        shell: Rscript {0}
        run: |
          install.packages(c("renv", "jsonlite"))
          m <- jsonlite::read_json("manifest.json")
          tracked <- system2("git", c("ls-files", "--", "app.R", "R"), stdout=TRUE)
          stopifnot(is.null(attr(tracked, "status")), "app.R" %in% tracked)
          files <- tracked[tracked == "app.R" | grepl("^R/.*[.]R$", tracked)]
          stopifnot(m$platform == "4.6.0", as.character(getRversion()) == m$platform,
            length(m$files) == length(files), setequal(names(m$files), files),
            all(file.exists(files)))
          expected <- vapply(m$files[files], function(f) f$checksum, character(1))
          stopifnot(identical(unname(tools::md5sum(files)), unname(expected)))
          packages <- m$packages
          valid <- vapply(names(packages), function(name) {
            p <- packages[[name]]
            isTRUE(p$Source %in% c("CRAN", "RSPM")) &&
              isTRUE(grepl("^https://[^/[:space:]]+(/[^[:space:]]*)?$", p$Repository)) &&
              identical(p$description$Package, name) &&
              isTRUE(nzchar(p$description$Version)) &&
              !identical(p$description$RemoteType, "any")
          }, logical(1))
          if (any(!valid)) stop("Unresolvable manifest metadata: ", paste(names(valid)[!valid], collapse=", "))
          urls <- unique(vapply(packages, function(p) p$Repository, character(1)))
          repos <- setNames(urls, paste0("Repo", seq_along(urls)))
          names(repos)[1] <- "CRAN"
          records <- lapply(packages, function(p) list(
            Package=p$description$Package, Version=p$description$Version,
            Source="Repository", Repository=names(repos)[match(p$Repository, repos)]))
          lock <- tempfile(fileext=".lock")
          jsonlite::write_json(list(R=list(Version=m$platform, Repositories=unname(
            Map(function(name,url) list(Name=name,URL=url), names(repos), repos))),
            Packages=records), lock, auto_unbox=TRUE)
          library <- file.path(Sys.getenv("RUNNER_TEMP"), "ldj-library")
          dir.create(library)
          renv::restore(project=getwd(), lockfile=lock, library=library, clean=TRUE,
            prompt=FALSE)
          check_versions <- function() {
            actual <- installed.packages(lib.loc=c(library, .Library))[, "Version"]
            expected <- vapply(records, function(p) p$Version, character(1))
            resolved <- unname(actual[names(expected)])
            wrong <- is.na(resolved) | resolved != unname(expected)
            if (any(wrong)) stop("Package versions differ: ", paste(
              names(expected)[wrong], resolved[wrong], "expected", expected[wrong], collapse="; "))
            cat(paste(names(expected), expected), sep="\n")
          }
          check_versions()
          .libPaths(c(library, .libPaths()))
          for (attempt in seq_len(3)) {
            if (requireNamespace("shinytest2", quietly=TRUE)) break
            install.packages("shinytest2", lib=library)
          }
          stopifnot(requireNamespace("shinytest2", quietly=TRUE))
          check_versions()
          cat(paste0("R_LIBS_USER=", library, "\n"), file=Sys.getenv("GITHUB_ENV"), append=TRUE)
          writeLines(capture.output(sessionInfo()), "R-session.txt")
      - name: Synthetic regression and Shiny tests
        run: |
          Rscript tests/unit.R
          Rscript tests/smoke.R
          Rscript tests/mtt-editorial.R
          Rscript tests/mtt-inference.R
          Rscript tests/demo-regression.R
      - name: Chromium first-load and figure export tests
        run: |
          Rscript tests/startup-browser.R
          Rscript tests/runtime-modules-browser.R
          Rscript tests/beta-data-colors-browser.R
          Rscript tests/axis-layout-browser.R
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ldj-prism-r460-verified
          path: |
            app.R
            R/
            manifest.json
            R-session.txt
            test-artifacts/
