name: Beta 0.10.1 dense matrix audit
on:
  push:
    branches: [audit/beta-0.10.1-stress]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: 980269621e5e37584881465c1cc5e649029cbb03
          path: candidate
      - name: Verify the Posit bundle allowlist and checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          m = json.loads(pathlib.Path("manifest.json").read_text())
          assert m["platform"] == "4.6.0" and m["metadata"]["appmode"] == "shiny"
          files = {"app.R", *(p.as_posix() for p in pathlib.Path("R").glob("*.R"))}
          assert files == set(m["files"])
          for name in files:
              content = pathlib.Path(name).read_bytes()
              assert hashlib.md5(content).hexdigest() == m["files"][name]["checksum"], name
              assert not re.search(rb"LDJ_MTT_(ROOT|UNITS_VERIFIED)|/private/project/|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}", content), name
          assert all(p["Repository"].startswith("https://") and p["Source"] in {"CRAN", "RSPM"}
                     for p in m["packages"].values())
          assert "synergyfinder" not in (p.lower() for p in m["packages"])
          PY
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::ggplot2@4.0.4
            any::ggrepel
            any::svglite
            any::colourpicker
            any::rhandsontable
            any::readxl
            any::writexl
            any::patchwork
            any::scales
            any::jsonlite
            any::viridisLite
            any::drc
            any::multcomp
            any::shinytest2
      - name: Integrated Chromium regression of the pinned candidate
        env:
          LDJ_TEST_ZIP: absent
        run: |
          test "$(git rev-parse HEAD)" = "980269621e5e37584881465c1cc5e649029cbb03"
          Rscript ../audit/tests/editorial-stress.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-0.10.1-editorial-stress
          path: candidate/test-artifacts
