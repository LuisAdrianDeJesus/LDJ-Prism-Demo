name: Beta 0.10.3 visual regression
on:
  push:
    branches: [fix/beta-0.10.3-first-load]
  pull_request:
    branches: [demo]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Verify the Posit bundle allowlist and checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          m = json.loads(pathlib.Path("manifest.json").read_text())
          assert m["platform"] == "4.6.0" and m["metadata"]["appmode"] == "shiny"
          files = {"app.R", *(p.as_posix() for p in pathlib.Path("R").glob("*.R"))}
          assert files == set(m["files"])
          for name in files:
              content = pathlib.Path(name).read_bytes()
              assert hashlib.md5(content).hexdigest() == m["files"][name]["checksum"], name
              assert not re.search(rb"LDJ_MTT_(ROOT|UNITS_VERIFIED)|/private/project/|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}", content), name
          assert all(p["Repository"].startswith("https://") and p["Source"] in {"CRAN", "RSPM"}
                     for p in m["packages"].values())
          assert "synergyfinder" not in (p.lower() for p in m["packages"])
          PY
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::ggplot2@4.0.4
            any::ggrepel
            any::svglite
            any::colourpicker
            any::rhandsontable
            any::readxl
            any::writexl
            any::patchwork
            any::scales
            any::jsonlite
            any::viridisLite
            any::drc
            any::multcomp
            any::shinytest2
      - name: Integrated Chromium regression of the pinned candidate
        env:
          LDJ_TEST_ZIP: absent
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          chrome="$(command -v google-chrome)"
          wrapper="$RUNNER_TEMP/ldj-chrome"
          printf '#!/bin/sh\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "$chrome" > "$wrapper"
          chmod +x "$wrapper"
          export CHROMOTE_CHROME="$wrapper"
          Rscript ../audit/tests/numeric-editorial.R
          Rscript ../audit/tests/synergy-browser.R
      - name: Exercise long labels and dense synthetic matrices
        run: Rscript ../audit/tests/editorial-stress.R
      - uses: actions/download-artifact@v4
        with:
          name: beta-0.10.1-visual-regression
          run-id: 45739499985
          github-token: ${{ github.token }}
          path: baseline
      - name: Compare scientific CSV against Beta 0.10.0
        run: |
          for f in Loewe-main.csv Loewe-recalculated.csv synergy-style-before.csv synergy-style-after.csv synergy-benefit.csv gallery-science.csv agreement-HSA-Bliss.csv agreement-HSA-Loewe.csv agreement-Bliss-Loewe.csv agreement-HSA-Bliss-Loewe.csv; do
            cmp "../baseline/$f" "test-artifacts/$f"
            sha256sum "test-artifacts/$f"
          done > test-artifacts/scientific-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-0.10.3-visual-regression
          path: candidate/test-artifacts
